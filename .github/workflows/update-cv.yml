name: Generate CV PDF

on:
  push:
    branches:
      - main
    paths:
      - 'cv.json'
      - 'cv-template.html'
      - 'style.css'
      - 'scripts/build-cv.js'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CV PDF
        run: npm run build:cv

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cv.pdf public/cv.pdf
          git commit -m "chore: Update compiled CV PDF [skip ci]" || echo "No changes to commit"
          git push
