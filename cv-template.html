<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>{{styles}}</style>
</head>
<body>
    <header>
        <h1>{{name}}</h1>
        <p class="contact-info">{{location}} &bull; {{phone}} &bull; {{email}}</p>
    </header>

    <section class="section">
        <h2>Summary</h2>
        <p>{{summary}}</p>
    </section>

    <section class="section">
        <h2>Skills</h2>
        <div class="skills-grid">
            {{skills}}
        </div>
    </section>

    <section class="section">
        <h2>Career Timeline</h2>
        <div class="timeline-container">
            {{timeline}}
        </div>
    </section>

    <section class="section">
        <h2>Work Experience</h2>
        {{experience}}
    </section>

    <section class="section">
        <h2>Education</h2>
        {{education}}
    </section>
</body>
</html>
